# E2: Multi-Level UNETR-style decoder —— f3/f6/f9/f12 逐级上采样 + skip
# Phase 1 正式协议：fold0 = validation, fold1-4 = training
run_name: e2_unetr
model_name: e2_unetr
checkpoint: weights/medsam_vit_b.pth
encoder_frozen: true

data:
  dataset_root: /opt/data/private/lm/data/Prostate/PI-CAI
  train_manifest: data/manifests/picai_slices_fold0_train.csv
  val_manifest: data/manifests/picai_slices_fold0_val.csv
  fold: 0
  input_mode: t2_repeat
  image_size: 1024
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  mask_cache_dir: data/cache/masks_aligned
  sampler:
    positive_ratio: 0.5
    num_samples: null

loss:
  name: dice_bce
  dice_weight: 1.0
  bce_weight: 1.0

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4

scheduler:
  name: cosine
  min_lr: 1.0e-6

train:
  epochs: 40
  batch_size: 4
  gradient_accumulation: 1
  amp: true
  amp_dtype: float16
  seed: 42
  val_interval: 2
  log_every: 20
  max_iterations: null

output:
  root: outputs/runs
